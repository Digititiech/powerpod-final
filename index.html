<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PowerPod Enterprise</title>

    <!-- Global Browser Extension Error Filter (Must run before any external scripts) -->
    <script>
      (function() {
        function isExtensionOrNoiseError(err) {
          if (!err) return false;
          var msg = typeof err === 'string' 
            ? err 
            : (err.message || err.reason || (err.error && err.error.message) || String(err));
          return (
            msg.indexOf('tabs:outgoing.message.ready') !== -1 ||
            msg.indexOf('No Listener') !== -1 ||
            msg.indexOf('extension context invalidated') !== -1 ||
            msg.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('moz-extension://') !== -1 ||
            msg.indexOf('safari-extension://') !== -1 ||
            msg.indexOf('ResizeObserver loop') !== -1 ||
            msg.indexOf('Could not establish connection') !== -1 ||
            msg.indexOf('message channel closed') !== -1 ||
            msg.indexOf('The message port closed before a response was received') !== -1 ||
            msg.indexOf('Receiving end does not exist') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionOrNoiseError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            console.warn('[Ignored Browser Extension Promise Rejection]:', event.reason);
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isExtensionOrNoiseError(event.error || event.message)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            console.warn('[Ignored Browser Extension Error]:', event.message || event.error);
            return true;
          }
        }, true);
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
